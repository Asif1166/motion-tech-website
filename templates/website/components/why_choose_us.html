<section class="py-5 why-choose-us">
    <div class="container text-center">
        <h2 class="base-main-title">Why Choose Us</h2>
        <p class="mb-5 base-text mx-auto" style="max-width: 700px;">
            Empowering businesses with reliable, scalable, and innovative digital solutions.
        </p>

        <div class="row g-4 justify-content-center">
            {% for item in why_choose_us %}
                <div class="col-lg-4 col-md-6">
                    <div class="why-card h-100 p-4 rounded-4 shadow-sm position-relative bg-white transition text-start border-0">
                        <div class="mb-3 icon-container fs-1 {{ item.icon_color|default:'text-primary' }}">
                            <i class="{{ item.icon }}"></i>
                        </div>
                        <h5 class="fw-bold mb-2 text-dark">{{ item.title }}</h5>
                        <p class="text-muted mb-0">
                            {{ item.description }}
                        </p>
                    </div>
                </div>
            {% empty %}
                <p class="text-muted">No items available.</p>
            {% endfor %}
        </div>
    </div>
</section>
