<section class="py-5">
    <div class="container text-center">
        <h2 class="base-main-title">Exclusive Services</h2>
        <p class="base-text mb-5 mx-auto" style="max-width: 700px;">
            Explore our range of high-quality digital solutions designed to elevate your business presence and performance.
        </p>

        <div class="row g-4 justify-content-center">
            {% for service in services %}
                <div class="col-lg-4 col-md-6 col-sm-12">
                    <div class="service-card h-100 p-4 rounded-4 shadow-sm position-relative overflow-hidden bg-white border-0 transition text-start">
                        <div class="service-icon mb-3 fs-1" style="color: {{ service.icon_color|default:'#0d6efd' }};">
                            <i class="{{ service.icon }}"></i>
                        </div>
                        <h5 class="fw-bold mb-2 text-dark">{{ service.title }}</h5>
                        <p class="text-muted mb-0">
                            {{ service.short_description }}
                        </p>
                    </div>
                </div>
            {% empty %}
                <p class="text-muted">No services available at the moment.</p>
            {% endfor %}
        </div>
    </div>
</section>
