<section class="py-5 product-section bg-light">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="base-main-title">Our Products</h2>
            <p class="base-text mx-auto" style="max-width: 700px;">
                Explore our innovative solutions designed to boost efficiency, sales, and growth.
            </p>
        </div>

        <div class="row g-4 justify-content-center">
            {% for product in products %}
                <div class="col-md-6 col-lg-3">
                    <div class="product-card {{ product.category_tag }}">
                        <div class="product-icon">
                            <i class="{{ product.icon }}" style="color: {{ product.icon_color }};"></i>
                        </div>
                        <h5>{{ product.title }}</h5>
                        <p class="text-muted">{{ product.short_description }}</p>
                        <a href="{% url 'products' %}" class="base-btn-primary">View Details</a>
                    </div>
                </div>
            {% empty %}
                <p class="text-muted text-center">No products available at the moment.</p>
            {% endfor %}
        </div>
    </div>
</section>
